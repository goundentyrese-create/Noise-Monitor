<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classroom Monitor // Liquid Glass</title>
  <style>
    :root {
      --bg-base: #07090e;
      --glass-bg: rgba(255, 255, 255, 0.055);
      --glass-border: rgba(255, 255, 255, 0.14);
      --glass-highlight: rgba(255, 255, 255, 0.28);
      --glass-shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.6), inset 0 1px 0 0 var(--glass-highlight);
      
      /* Default Colour Scheme: Emerald */
      --accent: #34d399;
      --accent-rgb: 52, 211, 153;
      --orb-1: rgba(16, 185, 129, 0.38);
      --orb-2: rgba(56, 189, 248, 0.25);
      
      --text: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.6);
    }

    /* Colour Schemes */
    body[data-color="blue"] {
      --accent: #38bdf8;
      --accent-rgb: 56, 189, 248;
      --orb-1: rgba(2, 132, 199, 0.42);
      --orb-2: rgba(99, 102, 241, 0.3);
    }

    body[data-color="sunset"] {
      --accent: #fb923c;
      --accent-rgb: 251, 146, 60;
      --orb-1: rgba(234, 88, 12, 0.4);
      --orb-2: rgba(236, 72, 153, 0.28);
    }

    body[data-color="purple"] {
      --accent: #c084fc;
      --accent-rgb: 192, 132, 252;
      --orb-1: rgba(147, 51, 234, 0.42);
      --orb-2: rgba(59, 130, 246, 0.28);
    }

    /* Alert States Override Orbs */
    body.warning-state {
      --orb-1: rgba(245, 158, 11, 0.42);
      --orb-2: rgba(251, 146, 60, 0.28);
    }

    body.danger-state {
      --orb-1: rgba(239, 68, 68, 0.5);
      --orb-2: rgba(244, 63, 94, 0.34);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 1.75rem 2.5rem;
      overflow: hidden;
      position: relative;
      transition: background-color 0.3s ease;
    }

    body.alarm-flash {
      background-color: #2a080d;
    }

    /* Ambient Liquid Orbs Behind Glass */
    .ambient-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(95px);
      transition: background 0.8s ease;
      animation: float 16s infinite alternate ease-in-out;
    }

    .orb-1 {
      width: 55vw;
      height: 55vw;
      max-width: 700px;
      max-height: 700px;
      background: var(--orb-1);
      top: 10%;
      left: 15%;
    }

    .orb-2 {
      width: 45vw;
      height: 45vw;
      max-width: 600px;
      max-height: 600px;
      background: var(--orb-2);
      bottom: 5%;
      right: 15%;
      animation-delay: -6s;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(4%, -5%) scale(1.06); }
      100% { transform: translate(-4%, 4%) scale(0.96); }
    }

    /* Reusable Liquid Glass Surface */
    .liquid-glass {
      background: var(--glass-bg);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
    }

    /* Header */
    header {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 1040px;
      margin: 0 auto;
    }

    .glass-pill {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.55rem 1.2rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.4px;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--text-secondary);
      transition: all 0.3s ease;
    }

    .status-pill.active .status-dot {
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
    }

    .status-pill.warning .status-dot {
      background: #fbbf24;
      box-shadow: 0 0 12px #fbbf24;
    }

    .status-pill.danger .status-dot {
      background: #ef4444;
      box-shadow: 0 0 12px #ef4444;
    }

    .strikes-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-secondary);
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-right: 0.2rem;
    }

    /* Default Strike Dots */
    .strike-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.14);
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.4);
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .strike-dot.active {
      background: #ef4444;
      box-shadow: 0 0 14px #ef4444, inset 0 1px 1px rgba(255, 255, 255, 0.6);
      transform: scale(1.25);
    }

    /* Football Theme: Referee Cards instead of Dots */
    body[data-theme="football"] .strike-dot {
      width: 11px;
      height: 15px;
      border-radius: 2.5px;
    }

    body[data-theme="football"] .strike-dot.active {
      background: #facc15;
      box-shadow: 0 0 14px rgba(250, 204, 21, 0.7), inset 0 1px 1px rgba(255, 255, 255, 0.7);
      transform: scale(1.18) rotate(-4deg);
    }

    body[data-theme="football"] #strike-3.active {
      background: #ef4444;
      box-shadow: 0 0 16px #ef4444, inset 0 1px 1px rgba(255, 255, 255, 0.7);
    }

    /* Main Glass Card Stage */
    main {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 920px;
      margin: 0 auto;
      padding: 2.2rem 3.5rem;
      border-radius: 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.8rem;
    }

    .hero-metric {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .theme-kicker {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.5rem;
      transition: color 0.3s ease;
    }

    .percentage-display {
      font-size: clamp(4.5rem, 11vw, 7.8rem);
      font-weight: 700;
      letter-spacing: -3.5px;
      line-height: 0.95;
      font-variant-numeric: tabular-nums;
      background: linear-gradient(180deg, #ffffff 25%, rgba(255, 255, 255, 0.65) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.25));
    }

    .reward-capsule {
      margin-top: 1rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 1.1rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }

    .reward-tag {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: var(--accent);
      text-transform: uppercase;
      transition: color 0.3s ease;
    }

    .reward-input {
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 500;
      outline: none;
      text-align: center;
      min-width: 170px;
    }

    /* Liquid Progress Track */
    .progress-track {
      width: 100%;
      height: 14px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      padding: 2px;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.4);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, rgba(255,255,255,0.85), var(--accent));
      border-radius: 999px;
      box-shadow: 0 0 18px var(--accent), inset 0 1px 1px rgba(255, 255, 255, 0.8);
      transition: width 0.2s linear, background 0.4s ease, box-shadow 0.4s ease;
    }

    /* Visualizer */
    .visualizer-wrapper {
      width: 100%;
      height: 135px;
      position: relative;
    }

    #visualizer {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Lockout Modal */
    #lockout-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 7, 12, 0.72);
      backdrop-filter: blur(36px) saturate(160%);
      -webkit-backdrop-filter: blur(36px) saturate(160%);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
      gap: 0.75rem;
    }

    .lockout-card {
      padding: 3rem 4rem;
      border-radius: 32px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }

    #lockout-overlay h1 {
      color: #f87171;
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    #lockout-overlay p {
      color: var(--text-secondary);
      font-size: 1.05rem;
    }

    #cooldown-timer {
      font-size: 4.5rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -2px;
      margin-top: 0.5rem;
    }

    /* Floating Control Dock */
    footer {
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.9rem;
      padding: 0.65rem 1.25rem;
      border-radius: 999px;
      width: fit-content;
      max-width: 100%;
      margin: 0 auto;
      opacity: 0.35;
      transform: translateY(4px);
      transition: opacity 0.35s ease, transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }

    footer:hover, footer.setup-mode {
      opacity: 1;
      transform: translateY(0);
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-secondary);
      letter-spacing: 0.4px;
    }

    .divider {
      width: 1px;
      height: 18px;
      background: rgba(255, 255, 255, 0.12);
    }

    button {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.15);
      padding: 0.42rem 0.95rem;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.78rem;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    button:hover {
      background: rgba(255, 255, 255, 0.16);
      transform: scale(1.02);
    }

    button.primary {
      background: #ffffff;
      color: #090b10;
      border: none;
      box-shadow: 0 4px 16px rgba(255, 255, 255, 0.25);
    }

    button.danger {
      color: #fca5a5;
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.3);
    }

    button.danger:hover {
      background: rgba(239, 68, 68, 0.85);
      color: #ffffff;
    }

    /* Theme Segmented Pill */
    .segmented-control {
      display: flex;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      padding: 2px;
    }

    .seg-btn {
      background: transparent;
      border: none;
      box-shadow: none;
      padding: 0.3rem 0.75rem;
      font-size: 0.75rem;
      color: var(--text-secondary);
    }

    .seg-btn:hover {
      transform: none;
      background: rgba(255, 255, 255, 0.06);
    }

    .seg-btn.active {
      background: rgba(255, 255, 255, 0.16);
      color: #ffffff;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    /* Color Swatches */
    .swatches {
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .swatch {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      padding: 0;
      border: 2px solid rgba(255, 255, 255, 0.25);
      box-shadow: none;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .swatch:hover {
      transform: scale(1.18);
    }

    .swatch.active {
      border-color: #ffffff;
      transform: scale(1.2);
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 76px;
      height: 5px;
      background: rgba(255, 255, 255, 0.16);
      border-radius: 999px;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
      cursor: pointer;
    }

    input[type="number"] {
      width: 42px;
      background: rgba(0, 0, 0, 0.25);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      padding: 0.28rem;
      text-align: center;
      font-size: 0.8rem;
      font-weight: 600;
      outline: none;
    }
  </style>
</head>
