<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classroom Monitor // Liquid Glass</title>
  <style>
    :root {
      --bg-base: #070a10;
      
      /* Compositor-Safe Liquid Glass Surface Tokens */
      --glass-surface: linear-gradient(145deg, rgba(255, 255, 255, 0.13) 0%, rgba(255, 255, 255, 0.04) 48%, rgba(255, 255, 255, 0.08) 100%);
      --glass-pill-fill: linear-gradient(180deg, rgba(255, 255, 255, 0.16) 0%, rgba(255, 255, 255, 0.05) 100%);
      --glass-specular: inset 0 1.5px 1px 0 rgba(255, 255, 255, 0.45), inset 1.5px 0 1px 0 rgba(255, 255, 255, 0.2), inset 0 -1.5px 2px 0 rgba(0, 0, 0, 0.45);
      --glass-drop-shadow: 0 24px 50px -12px rgba(0, 0, 0, 0.75), 0 4px 16px -2px rgba(0, 0, 0, 0.45);
      
      --accent: #34d399;
      --accent-rgb: 52, 211, 153;
      --orb-1: rgba(16, 185, 129, 0.36);
      --orb-2: rgba(56, 189, 248, 0.26);
      --orb-3: rgba(167, 243, 208, 0.16);
      
      --text: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.68);
    }

    body[data-color="blue"] {
      --accent: #38bdf8;
      --accent-rgb: 56, 189, 248;
      --orb-1: rgba(2, 132, 199, 0.42);
      --orb-2: rgba(99, 102, 241, 0.32);
      --orb-3: rgba(186, 230, 253, 0.18);
    }

    body[data-color="sunset"] {
      --accent: #fb923c;
      --accent-rgb: 251, 146, 60;
      --orb-1: rgba(234, 88, 12, 0.4);
      --orb-2: rgba(236, 72, 153, 0.28);
      --orb-3: rgba(254, 215, 170, 0.18);
    }

    body[data-color="purple"] {
      --accent: #c084fc;
      --accent-rgb: 192, 132, 252;
      --orb-1: rgba(147, 51, 234, 0.42);
      --orb-2: rgba(59, 130, 246, 0.3);
      --orb-3: rgba(233, 213, 255, 0.18);
    }

    /* iPhone 18 Pro Finishes */
    body[data-color="burgundy"] {
      --accent: #b83b50;
      --accent-rgb: 184, 59, 80;
      --orb-1: rgba(120, 32, 48, 0.55);
      --orb-2: rgba(184, 59, 80, 0.32);
      --orb-3: rgba(244, 114, 136, 0.16);
    }

    body[data-color="glacier"] {
      --accent: #bae6fd;
      --accent-rgb: 186, 230, 253;
      --orb-1: rgba(200, 228, 255, 0.34);
      --orb-2: rgba(125, 211, 252, 0.28);
      --orb-3: rgba(255, 255, 255, 0.18);
    }

    body[data-color="black"] {
      --accent: #a1a1aa;
      --accent-rgb: 161, 161, 170;
      --orb-1: rgba(82, 82, 91, 0.52);
      --orb-2: rgba(113, 113, 122, 0.3);
      --orb-3: rgba(212, 212, 216, 0.14);
    }

    body[data-color="silver"] {
      --accent: #f4f4f5;
      --accent-rgb: 244, 244, 245;
      --orb-1: rgba(228, 228, 231, 0.34);
      --orb-2: rgba(161, 161, 170, 0.28);
      --orb-3: rgba(255, 255, 255, 0.2);
    }

    body.warning-state {
      --orb-1: rgba(245, 158, 11, 0.44);
      --orb-2: rgba(251, 146, 60, 0.3);
    }

    body.danger-state {
      --orb-1: rgba(239, 68, 68, 0.52);
      --orb-2: rgba(244, 63, 94, 0.36);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text);
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 1rem;
      padding: 1.25rem 2rem;
      overflow: hidden;
      position: relative;
      transition: background-color 0.3s ease;
    }

    body.alarm-flash {
      background-color: #2a080d;
    }

    /* GPU-Safe Radial Gradient Orbs (Zero filter:blur crash risk) */
    .ambient-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      animation: float 18s infinite alternate ease-in-out;
      pointer-events: none;
    }

    .orb-1 {
      width: 65vw;
      height: 65vw;
      max-width: 850px;
      max-height: 850px;
      background: radial-gradient(circle, var(--orb-1) 0%, transparent 68%);
      top: -5%;
      left: 8%;
    }

    .orb-2 {
      width: 60vw;
      height: 60vw;
      max-width: 780px;
      max-height: 780px;
      background: radial-gradient(circle, var(--orb-2) 0%, transparent 68%);
      bottom: -8%;
      right: 8%;
      animation-delay: -6s;
    }

    .orb-3 {
      width: 45vw;
      height: 45vw;
      max-width: 580px;
      max-height: 580px;
      background: radial-gradient(circle, var(--orb-3) 0%, transparent 68%);
      top: 28%;
      left: 32%;
      animation-delay: -11s;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(4%, -5%) scale(1.06); }
      100% { transform: translate(-4%, 4%) scale(0.96); }
    }

    /* True Liquid Glass Panel */
    .liquid-glass {
      position: relative;
      background-color: rgba(18, 22, 32, 0.58);
      background-image: var(--glass-surface);
      border-top: 1px solid rgba(255, 255, 255, 0.38);
      border-left: 1px solid rgba(255, 255, 255, 0.24);
      border-right: 1px solid rgba(255, 255, 255, 0.14);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: var(--glass-specular), var(--glass-drop-shadow);
    }

    /* Header */
    header {
      position: relative;
      z-index: 20;
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 1040px;
      margin: 0 auto;
    }

    .glass-pill {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.55rem 1.25rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--text-secondary);
      transition: all 0.3s ease;
    }

    .status-pill.active .status-dot {
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
    }

    .status-pill.warning .status-dot {
      background: #fbbf24;
      box-shadow: 0 0 12px #fbbf24;
    }

    .status-pill.danger .status-dot {
      background: #ef4444;
      box-shadow: 0 0 12px #ef4444;
    }

    .strikes-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-secondary);
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-right: 0.2rem;
    }

    .strike-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.14);
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.5);
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .strike-dot.active {
      background: #ef4444;
      box-shadow: 0 0 14px #ef4444, inset 0 1px 1px rgba(255, 255, 255, 0.7);
      transform: scale(1.25);
    }

    body[data-theme="football"] .strike-dot {
      width: 11px;
      height: 15px;
      border-radius: 2.5px;
    }

    body[data-theme="football"] .strike-dot.active {
      background: #facc15;
      box-shadow: 0 0 14px rgba(250, 204, 21, 0.7), inset 0 1px 1px rgba(255, 255, 255, 0.7);
      transform: scale(1.18) rotate(-4deg);
    }

    body[data-theme="football"] #strike-3.active {
      background: #ef4444;
      box-shadow: 0 0 16px #ef4444, inset 0 1px 1px rgba(255, 255, 255, 0.7);
    }

    /* Main Stage */
    main {
      position: relative;
      z-index: 5;
      flex: 1;
      min-height: 0;
      width: 100%;
      max-width: 920px;
      margin: 0 auto;
      padding: 1.5rem 3rem;
      border-radius: 38px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
    }

    .hero-metric {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
    }

    .theme-kicker {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.4rem;
      transition: color 0.3s ease;
    }

    .percentage-display {
      font-size: clamp(3.5rem, 9vh, 7.2rem);
      font-weight: 700;
      letter-spacing: -3px;
      line-height: 0.95;
      font-variant-numeric: tabular-nums;
      color: #ffffff;
      text-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
    }

    .reward-capsule {
      margin-top: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.38rem 1.15rem;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.04) 100%);
      border-top: 1px solid rgba(255, 255, 255, 0.32);
      border-left: 1px solid rgba(255, 255, 255, 0.16);
      border-right: 1px solid rgba(255, 255, 255, 0.12);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: inset 0 1px 0.5px rgba(255, 255, 255, 0.35), 0 4px 12px rgba(0, 0, 0, 0.25);
    }

    .reward-tag {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: var(--accent);
      text-transform: uppercase;
      transition: color 0.3s ease;
    }

    .reward-input {
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 500;
      outline: none;
      text-align: center;
      min-width: 170px;
    }

    .progress-track {
      width: 100%;
      height: 16px;
      flex-shrink: 0;
      background: rgba(0, 0, 0, 0.42);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      padding: 2.5px;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.65), 0 1px 0 rgba(255, 255, 255, 0.18);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, rgba(255,255,255,0.9), var(--accent));
      border-radius: 999px;
      box-shadow: 0 0 20px var(--accent), inset 0 1px 1px rgba(255, 255, 255, 0.9);
      transition: width 0.2s linear, background 0.4s ease, box-shadow 0.4s ease;
    }

    .visualizer-wrapper {
      width: 100%;
      flex: 1;
      min-height: 70px;
      max-height: 150px;
      position: relative;
    }

    #visualizer {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Lockout Modal */
    #lockout-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 7, 12, 0.84);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      gap: 0.75rem;
    }

    .lockout-card {
      padding: 3rem 4rem;
      border-radius: 36px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }

    #lockout-overlay h1 {
      color: #f87171;
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    #lockout-overlay p {
      color: var(--text-secondary);
      font-size: 1.05rem;
    }

    #cooldown-timer {
      font-size: 4.5rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -2px;
      margin-top: 0.5rem;
    }

    /* Floating Control Dock */
    footer {
      position: relative;
      z-index: 500;
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.85rem;
      padding: 0.6rem 1.15rem;
      border-radius: 999px;
      width: fit-content;
      max-width: 100%;
      margin: 0 auto;
      opacity: 0.65;
      transition: opacity 0.35s ease, transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }

    footer:hover, footer.setup-mode {
      opacity: 1;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-secondary);
      letter-spacing: 0.3px;
    }

    .divider {
      width: 1px;
      height: 20px;
      background: linear-gradient(180deg, transparent, rgba(255, 255, 255, 0.24), transparent);
    }

    /* Tactile Liquid Glass Buttons */
    button.glass-btn {
      position: relative;
      background: var(--glass-pill-fill);
      color: var(--text);
      border-top: 1px solid rgba(255, 255, 255, 0.38);
      border-left: 1px solid rgba(255, 255, 255, 0.2);
      border-right: 1px solid rgba(255, 255, 255, 0.14);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: inset 0 1px 0.5px rgba(255, 255, 255, 0.42), 0 4px 12px rgba(0, 0, 0, 0.28);
      padding: 0.45rem 1.05rem;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.78rem;
      font-weight: 600;
      transition: all 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
      user-select: none;
      overflow: hidden;
    }

    button.glass-btn::after {
      content: "";
      position: absolute;
      top: 0;
      left: 8%;
      right: 8%;
      height: 48%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.25) 0%, rgba(255, 255, 255, 0) 100%);
      border-radius: 999px;
      pointer-events: none;
    }

    button.glass-btn:hover {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0.1) 100%);
      border-top-color: rgba(255, 255, 255, 0.58);
      transform: scale(1.04);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.55), 0 6px 16px rgba(0, 0, 0, 0.35);
    }

    button.glass-btn:active {
      transform: scale(0.94);
    }

    button.glass-btn.primary {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.96) 0%, rgba(226, 232, 240, 0.88) 100%);
      color: #07090e;
      border: 1px solid #ffffff;
      box-shadow: inset 0 1px 1px #ffffff, 0 6px 20px rgba(255, 255, 255, 0.28);
    }

    button.glass-btn.danger {
      color: #fecaca;
      background: linear-gradient(180deg, rgba(239, 68, 68, 0.32) 0%, rgba(239, 68, 68, 0.12) 100%);
      border-top-color: rgba(252, 165, 165, 0.45);
      border-color: rgba(248, 113, 113, 0.34);
    }

    button.glass-btn.danger:hover {
      background: linear-gradient(180deg, rgba(239, 68, 68, 0.88) 0%, rgba(220, 38, 38, 0.78) 100%);
      color: #ffffff;
    }

    /* Sliding Glass Pill Switcher */
    .segmented-control {
      position: relative;
      display: flex;
      align-items: center;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.13);
      box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.52), 0 1px 0 rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      padding: 3px;
    }

    .glass-glider {
      position: absolute;
      top: 3px;
      bottom: 3px;
      left: 3px;
      width: calc(50% - 3px);
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.3) 0%, rgba(255, 255, 255, 0.1) 100%);
      border-top: 1px solid rgba(255, 255, 255, 0.52);
      border-left: 1px solid rgba(255,
