<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classroom Monitor // Liquid Glass</title>
  <style>
    :root {
      --bg-base: #070a10;
      
      /* GPU-Safe Translucent Glass Surface */
      --glass-surface: rgba(22, 28, 44, 0.75);
      --glass-btn-fill: rgba(36, 48, 73, 0.85);
      --glass-btn-hover: rgba(48, 64, 95, 0.95);
      --glass-border: 1px solid rgba(255, 255, 255, 0.28);
      --glass-border-top: 1px solid rgba(255, 255, 255, 0.5);
      --glass-shadow: 0 16px 32px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.25);
      
      --accent: #34d399;
      --accent-rgb: 52, 211, 153;
      --orb-1: rgba(16, 185, 129, 0.4);
      --orb-2: rgba(56, 189, 248, 0.3);
      --orb-3: rgba(167, 243, 208, 0.18);
      
      --text: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.75);
    }

    body[data-color="blue"] {
      --accent: #38bdf8;
      --accent-rgb: 56, 189, 248;
    }

    body[data-color="sunset"] {
      --accent: #fb923c;
      --accent-rgb: 251, 146, 60;
    }

    body[data-color="purple"] {
      --accent: #c084fc;
      --accent-rgb: 192, 132, 252;
    }

    body[data-color="burgundy"] {
      --accent: #b83b50;
      --accent-rgb: 184, 59, 80;
    }

    body[data-color="glacier"] {
      --accent: #bae6fd;
      --accent-rgb: 186, 230, 253;
    }

    body[data-color="black"] {
      --accent: #a1a1aa;
      --accent-rgb: 161, 161, 170;
    }

    body[data-color="silver"] {
      --accent: #f4f4f5;
      --accent-rgb: 244, 244, 245;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text);
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 1rem;
      padding: 1.5rem 2rem;
      overflow: hidden;
      position: relative;
    }

    body.alarm-flash {
      background-color: #2a080d;
    }

    /* Ambient Lighting Canvas */
    .ambient-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }

    .orb-1 {
      width: 65vw;
      height: 65vw;
      max-width: 850px;
      max-height: 850px;
      background: radial-gradient(circle, var(--orb-1) 0%, transparent 68%);
      top: -10%;
      left: 5%;
    }

    .orb-2 {
      width: 60vw;
      height: 60vw;
      max-width: 780px;
      max-height: 780px;
      background: radial-gradient(circle, var(--orb-2) 0%, transparent 68%);
      bottom: -10%;
      right: 5%;
    }

    /* Full-Screen Liquid Glass Panels */
    .liquid-glass {
      position: relative;
      z-index: 5;
      background-color: var(--glass-surface);
      border: var(--glass-border);
      border-top: var(--glass-border-top);
      box-shadow: var(--glass-shadow);
      border-radius: 28px;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 1140px;
      margin: 0 auto;
      flex-shrink: 0;
    }

    .glass-pill {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.65rem 1.4rem;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 600;
      background-color: var(--glass-btn-fill);
      border: var(--glass-border);
      border-top: var(--glass-border-top);
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--text-secondary);
    }

    .status-pill.active .status-dot {
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
    }

    .status-pill.warning .status-dot {
      background: #fbbf24;
      box-shadow: 0 0 12px #fbbf24;
    }

    .status-pill.danger .status-dot {
      background: #ef4444;
      box-shadow: 0 0 12px #ef4444;
    }

    .strikes-label {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-right: 0.2rem;
    }

    .strike-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      transition: all 0.3s ease;
    }

    .strike-dot.active {
      background: #ef4444;
      box-shadow: 0 0 12px #ef4444;
      transform: scale(1.2);
    }

    body[data-theme="football"] .strike-dot {
      width: 12px;
      height: 16px;
      border-radius: 3px;
    }

    body[data-theme="football"] .strike-dot.active {
      background: #facc15;
      box-shadow: 0 0 12px rgba(250, 204, 21, 0.8);
      transform: scale(1.15) rotate(-4deg);
    }

    /* Main Stage Fills Vertical Space */
    main {
      flex: 1;
      width: 100%;
      max-width: 1140px;
      margin: 0 auto;
      padding: 2rem 3rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      min-height: 0;
    }

    .hero-metric {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .theme-kicker {
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.4rem;
    }

    .percentage-display {
      font-size: clamp(4rem, 10vh, 7.5rem);
      font-weight: 700;
      letter-spacing: -3px;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .reward-capsule {
      margin-top: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.45rem 1.3rem;
      border-radius: 999px;
      background-color: var(--glass-btn-fill);
      border: var(--glass-border);
    }

    .reward-tag {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: var(--accent);
      text-transform: uppercase;
    }

    .reward-input {
      background: transparent;
      border: none;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      outline: none;
      text-align: center;
      min-width: 170px;
    }

    .progress-track {
      width: 100%;
      height: 16px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 999px;
      padding: 2.5px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, rgba(255,255,255,0.9), var(--accent));
      border-radius: 999px;
      box-shadow: 0 0 16px var(--accent);
      transition: width 0.2s linear;
    }

    .visualizer-wrapper {
      width: 100%;
      flex: 1;
      min-height: 80px;
      max-height: 180px;
    }

    #visualizer {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Lockout Modal */
    #lockout-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 7, 12, 0.92);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      gap: 0.75rem;
    }

    .lockout-card {
      padding: 3rem 4rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }

    #lockout-overlay h1 {
      color: #f87171;
      font-size: 2.2rem;
    }

    #cooldown-timer {
      font-size: 4rem;
      font-weight: 700;
    }

    /* Control Dock */
    footer {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.85rem;
      padding: 0.8rem 1.4rem;
      border-radius: 999px;
      width: 100%;
      max-width: 1140px;
      margin: 0 auto;
      flex-shrink: 0;
      background-color: var(--glass-surface);
      border: var(--glass-border);
      border-top: var(--glass-border-top);
      box-shadow: var(--glass-shadow);
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      font-size: 0.82rem;
      font-weight: 600;
      color: #ffffff;
    }

    .divider {
      width: 1px;
      height: 20px;
      background: rgba(255, 255, 255, 0.3);
    }

    button.glass-btn {
      background-color: var(--glass-btn-fill);
      color: #ffffff;
      border: var(--glass-border);
      border-top: var(--glass-border-top);
      padding: 0.5rem 1.2rem;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 600;
      transition: background-color 0.2s, transform 0.15s;
    }

    button.glass-btn:hover {
      background-color: var(--glass-btn-hover);
      transform: scale(1.03);
    }

    button.glass-btn:active {
      transform: scale(0.95);
    }

    button.glass-btn.primary {
      background-color: #ffffff;
      color: #07090e;
      border: 1px solid #ffffff;
    }

    button.glass-btn.primary:hover {
      background-color: #e2e8f0;
    }

    button.glass-btn.danger {
      color: #fee2e2;
      background-color: rgba(239, 68, 68, 0.45);
      border: 1px solid rgba(248, 113, 113, 0.6);
    }

    button.glass-btn.danger:hover {
      background-color: rgba(239, 68, 68, 0.85);
    }

    .segmented-control {
      display: flex;
      align-items: center;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 999px;
      padding: 3px;
    }

    .seg-btn {
      width: 76px;
      background: transparent;
      border: none;
      padding: 0.35rem 0;
      font-size: 0.8rem;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.7);
      cursor: pointer;
    }

    .seg-btn.active {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.22);
      border-radius: 999px;
    }

    .swatches {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.3rem 0.55rem;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 999px;
    }

    .swatch {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      padding: 0;
      border: 2px solid rgba(255, 255, 255, 0.6);
      cursor: pointer;
      transition: transform 0.2s;
    }

    .swatch:hover {
      transform: scale(1.2);
    }

    .swatch.active {
      border-color: #ffffff;
      transform: scale(1.25);
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.9);
    }

    input[type="number"] {
      width: 46px;
      background: rgba(0, 0, 0, 0.5);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 999px;
      padding: 0.35rem 0.2rem;
      text-align: center;
      font-size: 0.82rem;
      font-weight: 600;
      outline: none;
    }
  </style>
</head>
<body data-theme="stealth" data-color="emerald">

  <div class="ambient-canvas">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <header>
    <div id="status-pill" class="glass-pill liquid-glass status-pill">
      <div class="status-dot"></div>
      <span id="status-text">Standby</span>
    </div>

    <div class="glass-pill liquid-glass">
      <span class="strikes-label" id="strikes-label">Alerts</span>
      <div class="strike-dot" id="strike-1"></div>
      <div class="strike-dot" id="strike-2"></div>
      <div class="strike-dot" id="strike-3"></div>
    </div>
  </header>

  <main class="liquid-glass">
    <div class="hero-metric">
      <div class="theme-kicker" id="theme-kicker">Acoustic Stealth Protocol</div>
      <div class="percentage-display" id="percent-text">0.0%</div>
      <div class="reward-capsule">
        <span class="reward-tag" id="reward-tag">Target</span>
        <input type="text" class="reward-input" value="5 Mins Free Time" id="reward-text" aria-label="Reward Goal">
      </div>
    </div>

    <div class="progress-track">
      <div class="progress-fill" id="progress-fill"></div>
    </div>

    <div class="visualizer-wrapper">
      <canvas id="visualizer"></canvas>
    </div>
  </main>

  <div id="lockout-overlay">
    <div class="lockout-card liquid-glass">
      <h1 id="lockout-title">System Lockdown</h1>
      <p id="lockout-desc">Noise threshold breached. Decryption paused.</p>
      <div id="cooldown-timer">00:10</div>
    </div>
  </div>

  <footer class="liquid-glass">
    <button type="button" id="start-btn" class="glass-btn primary" onclick="startMic()">Start Mic</button>
    <button type="button" id="reset-btn" class="glass-btn" onclick="resetMonitor()">Reset</button>

    <div class="divider"></div>

    <div class="segmented-control">
      <button type="button" id="btn-stealth" class="seg-btn active" onclick="setTheme('stealth')">Stealth</button>
      <button type="button" id="btn-football" class="seg-btn" onclick="setTheme('football')">Football</button>
    </div>

    <div class="swatches">
      <button type="button" id="col-emerald" class="swatch active" onclick="setColor('emerald')" style="background: #34d399;" title="Emerald"></button>
      <button type="button" id="col-blue" class="swatch" onclick="setColor('blue')" style="background: #38bdf8;" title="Electric Blue"></button>
      <button type="button" id="col-sunset" class="swatch" onclick="setColor('sunset')" style="background: #fb923c;" title="Sunset"></button>
      <button type="button" id="col-purple" class="swatch" onclick="setColor('purple')" style="background: #c084fc;" title="Ultraviolet"></button>
      <button type="button" id="col-burgundy" class="swatch" onclick="setColor('burgundy')" style="background: #4D1821;" title="Burgundy"></button>
      <button type="button" id="col-glacier" class="swatch" onclick="setColor('glacier')" style="background: #E8F2FF;" title="Glacier"></button>
      <button type="button" id="col-black" class="swatch" onclick="setColor('black')" style="background: #3C3C3C;" title="Black"></button>
      <button type="button" id="col-silver" class="swatch" onclick="setColor('silver')" style="background: #F7F7F7;" title="Silver"></button>
    </div>

    <div class="divider"></div>

    <div class="control-group">
      <label for="threshold">Limit</label>
      <input type="range" id="threshold" min="10" max="90" value="45" style="width: 80px;">
    </div>

    <div class="control-group">
      <label for="duration">Mins</label>
      <input type="number" id="duration" min="1" max="60" value="10">
    </div>

    <div class="divider"></div>

    <button type="button" id="manual-strike-btn" class="glass-btn danger" onclick="manualStrike()">Alert</button>
  </footer>

  <script>
    let audioCtx, analyser, dataArray, source;
    let isRunning = false;
    let isLockedOut = false;
    let progress = 0;
    let strikes = 0;
    let lastStrikeTime = 0;
    let lastFrameTime = Date.now();
    let currentTheme = "stealth";
    let currentState = "standby";

    const themes = {
      stealth: {
        kicker: "Acoustic Stealth Protocol",
        strikesLabel: "Alerts",
        rewardTag: "Target",
        strikeBtn: "Alert",
        lockoutTitle: "System Lockdown",
        lockoutDesc: "Noise threshold breached. Decryption paused.",
        status: {
          standby: "Standby",
          active: "Stealth Optimal",
          warning: "Approaching Limit",
          danger: "Noise Spike",
          unlocked: "Target Unlocked"
        }
      },
      football: {
        kicker: "Matchday Focus // 90 Min Protocol",
        strikesLabel: "Cards",
        rewardTag: "Trophy",
        strikeBtn: "Foul",
        lockoutTitle: "Red Card // Sin Bin",
        lockoutDesc: "Crowd too loud. Match play suspended for 10s.",
        status: {
          standby: "Pre-Match",
          active: "In Possession",
          warning: "Referee Warning",
          danger: "VAR Check // Foul!",
          unlocked: "Full Time // Victory!"
        }
      }
    };

    const canvas = document.getElementById("visualizer");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() {
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function setTheme(themeName) {
      if (currentTheme === themeName) return;
      currentTheme = themeName;
      document.body.setAttribute("data-theme", themeName);

      document.getElementById("btn-stealth").classList.toggle("active", themeName === "stealth");
      document.getElementById("btn-football").classList.toggle("active", themeName === "football");

      const t = themes[themeName];
      document.getElementById("theme-kicker").textContent = t.kicker;
      document.getElementById("strikes-label").textContent = t.strikesLabel;
      document.getElementById("reward-tag").textContent = t.rewardTag;
      document.getElementById("manual-strike-btn").textContent = t.strikeBtn;
      document.getElementById("lockout-title").textContent = t.lockoutTitle;
      document.getElementById("lockout-desc").textContent = t.lockoutDesc;

      updateStatus(currentState);
    }

    function setColor(colorName) {
      document.body.setAttribute("data-color", colorName);
      ["emerald", "blue", "sunset", "purple", "burgundy", "glacier", "black", "silver"].forEach(c => {
        const el = document.getElementById("col-" + c);
        if (el) el.classList.toggle("active", c === colorName);
      });
    }

    async function startMic() {
      if (isRunning) return;
      const startBtn = document.getElementById("start-btn");
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
        if (audioCtx.state === "suspended") {
          await audioCtx.resume();
        }
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 128;
        source = audioCtx.createMediaStreamSource(stream);
        source.connect(analyser);
        dataArray = new Uint8Array(analyser.frequencyBinCount);
        
        isRunning = true;
        lastFrameTime = Date.now();
        resizeCanvas();
        startBtn.textContent = "Listening";
        startBtn.classList.remove("primary");
        updateStatus("active");
        loop();
      } catch (err) {
        alert("Microphone access error: " + err.message);
      }
    }

    function resetMonitor() {
      progress = 0;
      strikes = 0;
      isLockedOut = false;
      document.getElementById("lockout-overlay").style.display = "none";
      updateStrikesUI();
      updateProgressUI();
      updateStatus(isRunning ? "active" : "standby");
    }

    function manualStrike() {
      if (!isLockedOut) triggerStrike();
    }

    function updateStatus(stateKey) {
      currentState = stateKey;
      const t = themes[currentTheme];
      document.getElementById("status-text").textContent = t.status[stateKey] || stateKey;

      const pillClass = (stateKey === "unlocked") ? "active" : stateKey;
      document.getElementById("status-pill").className = "glass-pill liquid-glass status-pill " + pillClass;
      
      document.body.classList.remove("warning-state", "danger-state");
    }

    function updateStrikesUI() {
      for (let i = 1; i <= 3; i++) {
        const dot = document.getElementById("strike-" + i);
        if (i <= strikes) dot.classList.add("active");
        else dot.classList.remove("active");
      }
    }

    function updateProgressUI() {
      const clamped = Math.min(100, Math.max(0, progress));
      document.getElementById("progress-fill").style.width = clamped + "%";
      document.getElementById("percent-text").textContent = clamped.toFixed(1) + "%";

      if (clamped >= 100) {
        updateStatus("unlocked");
      }
    }

    function triggerStrike() {
      const now = Date.now();
      if (now - lastStrikeTime < 2000) return;
      lastStrikeTime = now;

      strikes++;
      updateStrikesUI();

      document.body.classList.add("alarm-flash");
      setTimeout(() => document.body.classList.remove("alarm-flash"), 250);

      progress = Math.max(0, progress - 2);
      updateProgressUI();

      if (strikes >= 3) {
        startLockout();
      } else {
        updateStatus("danger");
      }
    }

    function startLockout() {
      isLockedOut = true;
      const overlay = document.getElementById("lockout-overlay");
      const timer = document.getElementById("cooldown-timer");
      overlay.style.display = "flex";
      let secondsLeft = 10;
      timer.textContent = "00:" + secondsLeft;

      const interval = setInterval(() => {
        secondsLeft--;
        timer.textContent = "00:" + (secondsLeft < 10 ? "0" : "") + secondsLeft;
        if (secondsLeft <= 0) {
          clearInterval(interval);
          isLockedOut = false;
          strikes = 0;
          updateStrikesUI();
          overlay.style.display = "none";
          updateStatus("active");
        }
      }, 1000);
    }

    function loop() {
      requestAnimationFrame(loop);
      const now = Date.now();
      const deltaSeconds = (now - lastFrameTime) / 1000;
      lastFrameTime = now;

      analyser.getByteFrequencyData(dataArray);

      let sum = 0;
      const usableBins = Math.floor(dataArray.length * 0.65);
      for (let i = 0; i < usableBins; i++) {
        sum += dataArray[i];
      }
      const averageVolume = (sum / usableBins) / 2.55;
      const threshold = parseInt(document.getElementById("threshold").value, 10);

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const gap = 6;
      const totalBars = usableBins;
      const barWidth = Math.max(2, (canvas.width - (gap * (totalBars - 1))) / totalBars);

      for (let i = 0; i < totalBars; i++) {
        const value = dataArray[i] / 255;
        const barHeight = Math.max(6, value * canvas.height);
        const x = i * (barWidth + gap);
        const y = canvas.height - barHeight;

        const accentRgb = getComputedStyle(document.body).getPropertyValue("--accent-rgb").trim() || "52, 211, 153";
        const gradient = ctx.createLinearGradient(0, y, 0, canvas.height);
        
        if (averageVolume > threshold) {
          gradient.addColorStop(0, "rgba(248, 113, 113, 0.95)");
          gradient.addColorStop(1, "rgba(239, 68, 68, 0.25)");
        } else if (averageVolume > threshold * 0.8) {
