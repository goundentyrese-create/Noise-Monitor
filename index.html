<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classroom Monitor // Liquid Glass</title>
  <style>
    :root {
      --bg-base: #07090e;
      --glass-bg: rgba(255, 255, 255, 0.055);
      --glass-border: rgba(255, 255, 255, 0.14);
      --glass-highlight: rgba(255, 255, 255, 0.28);
      --glass-shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.6), inset 0 1px 0 0 var(--glass-highlight);
      
      /* Default Colour Scheme: Emerald */
      --accent: #34d399;
      --accent-rgb: 52, 211, 153;
      --orb-1: rgba(16, 185, 129, 0.38);
      --orb-2: rgba(56, 189, 248, 0.25);
      
      --text: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.6);
    }

    body[data-color="blue"] {
      --accent: #38bdf8;
      --accent-rgb: 56, 189, 248;
      --orb-1: rgba(2, 132, 199, 0.42);
      --orb-2: rgba(99, 102, 241, 0.3);
    }

    body[data-color="sunset"] {
      --accent: #fb923c;
      --accent-rgb: 251, 146, 60;
      --orb-1: rgba(234, 88, 12, 0.4);
      --orb-2: rgba(236, 72, 153, 0.28);
    }

    body[data-color="purple"] {
      --accent: #c084fc;
      --accent-rgb: 192, 132, 252;
      --orb-1: rgba(147, 51, 234, 0.42);
      --orb-2: rgba(59, 130, 246, 0.28);
    }

    body.warning-state {
      --orb-1: rgba(245, 158, 11, 0.42);
      --orb-2: rgba(251, 146, 60, 0.28);
    }

    body.danger-state {
      --orb-1: rgba(239, 68, 68, 0.5);
      --orb-2: rgba(244, 63, 94, 0.34);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text);
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 1rem;
      padding: 1.25rem 2rem;
      overflow: hidden;
      position: relative;
      transition: background-color 0.3s ease;
    }

    body.alarm-flash {
      background-color: #2a080d;
    }

    .ambient-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(95px);
      transition: background 0.8s ease;
      animation: float 16s infinite alternate ease-in-out;
      pointer-events: none;
    }

    .orb-1 {
      width: 55vw;
      height: 55vw;
      max-width: 700px;
      max-height: 700px;
      background: var(--orb-1);
      top: 10%;
      left: 15%;
    }

    .orb-2 {
      width: 45vw;
      height: 45vw;
      max-width: 600px;
      max-height: 600px;
      background: var(--orb-2);
      bottom: 5%;
      right: 15%;
      animation-delay: -6s;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(4%, -5%) scale(1.06); }
      100% { transform: translate(-4%, 4%) scale(0.96); }
    }

    .liquid-glass {
      background: var(--glass-bg);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
    }

    /* Header */
    header {
      position: relative;
      z-index: 20;
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 1040px;
      margin: 0 auto;
    }

    .glass-pill {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.5rem 1.15rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.4px;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--text-secondary);
      transition: all 0.3s ease;
    }

    .status-pill.active .status-dot {
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
    }

    .status-pill.warning .status-dot {
      background: #fbbf24;
      box-shadow: 0 0 12px #fbbf24;
    }

    .status-pill.danger .status-dot {
      background: #ef4444;
      box-shadow: 0 0 12px #ef4444;
    }

    .strikes-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-secondary);
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-right: 0.2rem;
    }

    .strike-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.14);
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.4);
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .strike-dot.active {
      background: #ef4444;
      box-shadow: 0 0 14px #ef4444, inset 0 1px 1px rgba(255, 255, 255, 0.6);
      transform: scale(1.25);
    }

    body[data-theme="football"] .strike-dot {
      width: 11px;
      height: 15px;
      border-radius: 2.5px;
    }

    body[data-theme="football"] .strike-dot.active {
      background: #facc15;
      box-shadow: 0 0 14px rgba(250, 204, 21, 0.7), inset 0 1px 1px rgba(255, 255, 255, 0.7);
      transform: scale(1.18) rotate(-4deg);
    }

    body[data-theme="football"] #strike-3.active {
      background: #ef4444;
      box-shadow: 0 0 16px #ef4444, inset 0 1px 1px rgba(255, 255, 255, 0.7);
    }

    /* Main Stage */
    main {
      position: relative;
      z-index: 5;
      flex: 1;
      min-height: 0;
      width: 100%;
      max-width: 920px;
      margin: 0 auto;
      padding: 1.5rem 3rem;
      border-radius: 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
    }

    .hero-metric {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
    }

    .theme-kicker {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.4rem;
      transition: color 0.3s ease;
    }

    .percentage-display {
      font-size: clamp(3.5rem, 9vh, 7.2rem);
      font-weight: 700;
      letter-spacing: -3px;
      line-height: 0.95;
      font-variant-numeric: tabular-nums;
      background: linear-gradient(180deg, #ffffff 25%, rgba(255, 255, 255, 0.65) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.25));
    }

    .reward-capsule {
      margin-top: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 1.1rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }

    .reward-tag {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: var(--accent);
      text-transform: uppercase;
      transition: color 0.3s ease;
    }

    .reward-input {
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 500;
      outline: none;
      text-align: center;
      min-width: 170px;
    }

    .progress-track {
      width: 100%;
      height: 14px;
      flex-shrink: 0;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      padding: 2px;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.4);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, rgba(255,255,255,0.85), var(--accent));
      border-radius: 999px;
      box-shadow: 0 0 18px var(--accent), inset 0 1px 1px rgba(255, 255, 255, 0.8);
      transition: width 0.2s linear, background 0.4s ease, box-shadow 0.4s ease;
    }

    .visualizer-wrapper {
      width: 100%;
      flex: 1;
      min-height: 70px;
      max-height: 150px;
      position: relative;
    }

    #visualizer {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Lockout Modal */
    #lockout-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 7, 12, 0.72);
      backdrop-filter: blur(36px) saturate(160%);
      -webkit-backdrop-filter: blur(36px) saturate(160%);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      gap: 0.75rem;
    }

    .lockout-card {
      padding: 3rem 4rem;
      border-radius: 32px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }

    #lockout-overlay h1 {
      color: #f87171;
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    #lockout-overlay p {
      color: var(--text-secondary);
      font-size: 1.05rem;
    }

    #cooldown-timer {
      font-size: 4.5rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -2px;
      margin-top: 0.5rem;
    }

    /* Floating Control Dock */
    footer {
      position: relative;
      z-index: 500;
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.85rem;
      padding: 0.6rem 1.2rem;
      border-radius: 999px;
      width: fit-content;
      max-width: 100%;
      margin: 0 auto;
      opacity: 0.4;
      transition: opacity 0.3s ease;
    }

    footer:hover, footer.setup-mode {
      opacity: 1;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-secondary);
      letter-spacing: 0.4px;
    }

    .divider {
      width: 1px;
      height: 18px;
      background: rgba(255, 255, 255, 0.12);
    }

    button {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.15);
      padding: 0.42rem 0.95rem;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.78rem;
      font-weight: 600;
      transition: background 0.2s ease, transform 0.15s ease;
      user-select: none;
    }

    button:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    button:active {
      transform: scale(0.96);
    }

    button.primary {
      background: #ffffff;
      color: #090b10;
      border: none;
      box-shadow: 0 4px 16px rgba(255, 255, 255, 0.25);
    }

    button.danger {
      color: #fca5a5;
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.3);
    }

    button.danger:hover {
      background: rgba(239, 68, 68, 0.85);
      color: #ffffff;
    }

    .segmented-control {
      display: flex;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      padding: 2px;
    }

    .seg-btn {
      background: transparent;
      border: none;
      box-shadow: none;
      padding: 0.3rem 0.75rem;
      font-size: 0.75rem;
      color: var(--text-secondary);
    }

    .seg-btn.active {
      background: rgba(255, 255, 255, 0.18);
      color: #ffffff;
    }

    .swatches {
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .swatch {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      padding: 0;
      border: 2px solid rgba(255, 255, 255, 0.25);
      box-shadow: none;
    }

    .swatch.active {
      border-color: #ffffff;
      transform: scale(1.2);
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 76px;
      height: 5px;
      background: rgba(255, 255, 255, 0.16);
      border-radius: 999px;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
      cursor: pointer;
    }

    input[type="number"] {
      width: 42px;
      background: rgba(0, 0, 0, 0.25);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      padding: 0.28rem;
      text-align: center;
      font-size: 0.8rem;
      font-weight: 600;
      outline: none;
    }
  </style>
</head>
<body data-theme="stealth" data-color="emerald">

  <div class="ambient-canvas">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <header>
    <div id="status-pill" class="glass-pill liquid-glass status-pill">
      <div class="status-dot"></div>
      <span id="status-text">Standby</span>
    </div>

    <div class="glass-pill liquid-glass">
      <span class="strikes-label" id="strikes-label">Alerts</span>
      <div class="strike-dot" id="strike-1"></div>
      <div class="strike-dot" id="strike-2"></div>
      <div class="strike-dot" id="strike-3"></div>
    </div>
  </header>

  <main class="liquid-glass">
    <div class="hero-metric">
      <div class="theme-kicker" id="theme-kicker">Acoustic Stealth Protocol</div>
      <div class="percentage-display" id="percent-text">0.0%</div>
      <div class="reward-capsule">
        <span class="reward-tag" id="reward-tag">Target</span>
        <input type="text" class="reward-input" value="5 Mins Free Time" id="reward-text" aria-label="Reward Goal">
      </div>
    </div>

    <div class="progress-track">
      <div class="progress-fill" id="progress-fill"></div>
    </div>

    <div class="visualizer-wrapper">
      <canvas id="visualizer"></canvas>
    </div>
  </main>

  <div id="lockout-overlay">
    <div class="lockout-card liquid-glass">
      <h1 id="lockout-title">System Lockdown</h1>
      <p id="lockout-desc">Noise threshold breached. Decryption paused.</p>
      <div id="cooldown-timer">00:10</div>
    </div>
  </div>

  <footer id="control-dock" class="liquid-glass setup-mode">
    <button type="button" id="start-btn" class="primary">Start Mic</button>
    <button type="button" id="reset-btn">Reset</button>

    <div class="divider"></div>

    <div class="segmented-control">
      <button type="button" class="seg-btn active" data-set-theme="stealth">Stealth</button>
      <button type="button" class="seg-btn" data-set-theme="football">Football</button>
    </div>

    <div class="swatches">
      <button type="button" class="swatch active" data-set-color="emerald" style="background: #34d399;" title="Emerald"></button>
      <button type="button" class="swatch" data-set-color="blue" style="background: #38bdf8;" title="Electric Blue"></button>
      <button type="button" class="swatch" data-set-color="sunset" style="background: #fb923c;" title="Sunset"></button>
      <button type="button" class="swatch" data-set-color="purple" style="background: #c084fc;" title="Ultraviolet"></button>
    </div>

    <div class="divider"></div>

    <div class="control-group">
      <label for="threshold">Limit</label>
      <input type="range" id="threshold" min="10" max="90" value="45">
    </div>

    <div class="control-group">
      <label for="duration">Mins</label>
      <input type="number" id="duration" min="1" max="60" value="10">
    </div>

    <div class="divider"></div>

    <button type="button" id="manual-strike-btn" class="danger">Alert</button>
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      let audioCtx, analyser, dataArray, source;
      let isRunning = false;
      let isLockedOut = false;
      let progress = 0;
      let strikes = 0;
      let lastStrikeTime = 0;
      let lastFrameTime = Date.now();
      let currentTheme = "stealth";
      let currentState = "standby";

      const themes = {
        stealth: {
          kicker: "Acoustic Stealth Protocol",
          strikesLabel: "Alerts",
          rewardTag: "Target",
          strikeBtn: "Alert",
          lockoutTitle: "System Lockdown",
          lockoutDesc: "Noise threshold breached. Decryption paused.",
          status: {
            standby: "Standby",
            active: "Stealth Optimal",
            warning: "Approaching Limit",
            danger: "Noise Spike",
            unlocked: "Target Unlocked"
          }
        },
        football: {
          kicker: "Matchday Focus // 90' Protocol",
          strikesLabel: "Cards",
          rewardTag: "Trophy",
          strikeBtn: "Foul",
          lockoutTitle: "Red Card // Sin Bin",
          lockoutDesc: "Crowd too loud. Match play suspended for 10s.",
          status: {
            standby: "Pre-Match",
            active: "In Possession",
            warning: "Referee Warning",
            danger: "VAR Check // Foul!",
            unlocked: "Full Time // Victory!"
          }
        }
      };

      const canvas = document.getElementById("visualizer");
      const ctx = canvas.getContext("2d");
      const statusPill = document.getElementById("status-pill");
      const statusText = document.getElementById("status-text");
      const progressFill = document.getElementById("progress-fill");
      const percentText = document.getElementById("percent-text");
      const thresholdSlider = document.getElementById("threshold");
      const durationInput = document.getElementById("duration");
      const lockoutOverlay = document.getElementById("lockout-overlay");
      const cooldownTimer = document.getElementById("cooldown-timer");
      const controlDock = document.getElementById("control-dock");
      const startBtn = document.getElementById("start-btn");

      function resizeCanvas() {
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
      }
      window.addEventListener("resize", resizeCanvas);
      resizeCanvas();

      // Theme Switcher
      document.querySelectorAll("[data-set-theme]").forEach(btn => {
        btn.addEventListener("click", () => {
          currentTheme = btn.dataset.setTheme;
          document.body.dataset.theme = currentTheme;

          document.querySelectorAll("[data-set-theme]").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");

          const t = themes[currentTheme];
          document.getElementById("theme-kicker").textContent = t.kicker;
          document.getElementById("strikes-label").textContent = t.strikesLabel;
          document.getElementById("reward-tag").textContent = t.rewardTag;
          document.getElementById("manual-strike-btn").textContent = t.strikeBtn;
          document.getElementById("lockout-title").textContent = t.lockoutTitle;
          document.getElementById("lockout-desc").textContent = t.lockoutDesc;

          updateStatus(currentState);
        });
      });

      // Colour Scheme Switcher
      document.querySelectorAll("[data-set-color]").forEach(btn => {
        btn.addEventListener("click", () => {
          document.body.dataset.color = btn.dataset.setColor;
          document.querySelectorAll("[data-set-color]").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
        });
      });

      // Mic Initialization
      startBtn.addEventListener("click", async () => {
        if (isRunning) return;
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AudioContextClass();
          if (audioCtx.state === "suspended") {
            await audioCtx.resume();
          }
          analyser = audioCtx.createAnalyser();
          analyser.fftSize = 128;
          source = audioCtx.createMediaStreamSource(stream);
          source.connect(analyser);
          dataArray = new Uint8Array(analyser.frequencyBinCount);
          
          isRunning = true;
          lastFrameTime = Date.now();
          resizeCanvas();
          startBtn.textContent = "Listening";
          startBtn.classList.remove("primary");
          controlDock.classList.remove("setup-mode");
          updateStatus("active");
          loop();
        } catch (err) {
          alert("Microphone error: " + err.message);
        }
      });

      document.getElementById("reset-btn").addEventListener("click", () => {
        progress = 0;
        strikes = 0;
        isLockedOut = false;
        lockoutOverlay.style.display = "none";
        updateStrikesUI();
        updateProgressUI();
        updateStatus(isRunning ? "active" : "standby");
      });

      document.getElementById("manual-strike-btn").addEventListener("click", () => {
        if (!isLockedOut) triggerStrike();
      });

      function updateStatus(stateKey) {
        currentState = stateKey;
        const t = themes[currentTheme];
        statusText.textContent = t.status[stateKey] || stateKey;

        const pillClass = (stateKey === "unlocked") ? "active" : stateKey;
        statusPill.className = "glass-pill liquid-glass status-pill " + pillClass;
        
        document.body.classList.remove("warning-state", "danger-state");
        if (stateKey === "warning") document.body.classList.add("warning-state");
        if (stateKey === "danger") document.body.classList.add("danger-state");
      }

      function updateStrikesUI() {
        for (let i = 1; i <= 3; i++) {
          const dot = document.getElementById(`strike-${i}`);
          if (i <= strikes) dot.classList.add("active");
          else dot.classList.remove("active");
        }
      }

      function updateProgressUI() {
        const clamped = Math.min(100, Math.max(0, progress));
        progressFill.style.width = `${clamped}%`;
        percentText.textContent = `${clamped.toFixed(1)}%`;

        if (clamped >= 100) {
          updateStatus("unlocked");
        }
      }

      function triggerStrike() {
        const now = Date.now();
        if (now - lastStrikeTime < 2000) return;
        lastStrikeTime = now;

        strikes++;
        updateStrikesUI();

        document.body.classList.add("alarm-flash");
        setTimeout(() => document.body.classList.remove("alarm-flash"), 250);

        progress = Math.max(0, progress - 2);
        updateProgressUI();

        if (strikes >= 3) {
          startLockout();
        } else {
          updateStatus("danger");
        }
      }

      function startLockout() {
        isLockedOut = true;
        lockoutOverlay.style.display = "flex";
        let secondsLeft = 10;
