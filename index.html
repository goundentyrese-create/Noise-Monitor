<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classroom Monitor // Liquid Glass</title>
  <style>
    :root {
      --bg-base: #05070b;
      
      /* True Liquid Glass Material Tokens (Compositor-Safe) */
      --glass-fill: linear-gradient(145deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.03) 50%, rgba(255, 255, 255, 0.06) 100%);
      --glass-pill-fill: linear-gradient(180deg, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0.04) 100%);
      --glass-border-top: rgba(255, 255, 255, 0.36);
      --glass-border-side: rgba(255, 255, 255, 0.15);
      --glass-border-bottom: rgba(255, 255, 255, 0.08);
      --glass-specular: inset 0 1.5px 1px 0 rgba(255, 255, 255, 0.42), inset 1.5px 0 1px 0 rgba(255, 255, 255, 0.18), inset 0 -1.5px 2px 0 rgba(0, 0, 0, 0.4);
      --glass-drop-shadow: 0 28px 60px -12px rgba(0, 0, 0, 0.72), 0 4px 16px -2px rgba(0, 0, 0, 0.4);
      
      --accent: #34d399;
      --accent-rgb: 52, 211, 153;
      --orb-1: rgba(16, 185, 129, 0.42);
      --orb-2: rgba(56, 189, 248, 0.3);
      --orb-3: rgba(167, 243, 208, 0.18);
      
      --text: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.65);
    }

    body[data-color="blue"] {
      --accent: #38bdf8;
      --accent-rgb: 56, 189, 248;
      --orb-1: rgba(2, 132, 199, 0.46);
      --orb-2: rgba(99, 102, 241, 0.34);
      --orb-3: rgba(186, 230, 253, 0.2);
    }

    body[data-color="sunset"] {
      --accent: #fb923c;
      --accent-rgb: 251, 146, 60;
      --orb-1: rgba(234, 88, 12, 0.44);
      --orb-2: rgba(236, 72, 153, 0.32);
      --orb-3: rgba(254, 215, 170, 0.2);
    }

    body[data-color="purple"] {
      --accent: #c084fc;
      --accent-rgb: 192, 132, 252;
      --orb-1: rgba(147, 51, 234, 0.46);
      --orb-2: rgba(59, 130, 246, 0.32);
      --orb-3: rgba(233, 213, 255, 0.2);
    }

    /* iPhone 18 Pro Finishes */
    body[data-color="burgundy"] {
      --accent: #b83b50;
      --accent-rgb: 184, 59, 80;
      --orb-1: rgba(77, 24, 33, 0.72);
      --orb-2: rgba(184, 59, 80, 0.36);
      --orb-3: rgba(244, 114, 136, 0.18);
    }

    body[data-color="glacier"] {
      --accent: #bae6fd;
      --accent-rgb: 186, 230, 253;
      --orb-1: rgba(232, 242, 255, 0.38);
      --orb-2: rgba(125, 211, 252, 0.32);
      --orb-3: rgba(255, 255, 255, 0.2);
    }

    body[data-color="black"] {
      --accent: #a1a1aa;
      --accent-rgb: 161, 161, 170;
      --orb-1: rgba(60, 60, 60, 0.72);
      --orb-2: rgba(113, 113, 122, 0.35);
      --orb-3: rgba(212, 212, 216, 0.15);
    }

    body[data-color="silver"] {
      --accent: #f4f4f5;
      --accent-rgb: 244, 244, 245;
      --orb-1: rgba(247, 247, 247, 0.38);
      --orb-2: rgba(161, 161, 170, 0.32);
      --orb-3: rgba(255, 255, 255, 0.22);
    }

    body.warning-state {
      --orb-1: rgba(245, 158, 11, 0.46);
      --orb-2: rgba(251, 146, 60, 0.32);
    }

    body.danger-state {
      --orb-1: rgba(239, 68, 68, 0.54);
      --orb-2: rgba(244, 63, 94, 0.38);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text);
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 1rem;
      padding: 1.25rem 2rem;
      overflow: hidden;
      position: relative;
      transition: background-color 0.3s ease;
    }

    body.alarm-flash {
      background-color: #2a080d;
    }

    .ambient-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(85px);
      transition: background 0.8s ease;
      animation: float 18s infinite alternate ease-in-out;
      pointer-events: none;
    }

    .orb-1 {
      width: 50vw;
      height: 50vw;
      max-width: 680px;
      max-height: 680px;
      background: var(--orb-1);
      top: 8%;
      left: 14%;
    }

    .orb-2 {
      width: 45vw;
      height: 45vw;
      max-width: 600px;
      max-height: 600px;
      background: var(--orb-2);
      bottom: 6%;
      right: 14%;
      animation-delay: -6s;
    }

    .orb-3 {
      width: 32vw;
      height: 32vw;
      max-width: 420px;
      max-height: 420px;
      background: var(--orb-3);
      top: 42%;
      left: 42%;
      animation-delay: -11s;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(5%, -6%) scale(1.08); }
      100% { transform: translate(-5%, 5%) scale(0.95); }
    }

    /* True Liquid Glass Material with Directional Specular Lighting */
    .liquid-glass {
      position: relative;
      background: var(--glass-fill);
      backdrop-filter: blur(36px) saturate(210%) brightness(1.06);
      -webkit-backdrop-filter: blur(36px) saturate(210%) brightness(1.06);
      border-top: 1px solid var(--glass-border-top);
      border-left: 1px solid rgba(255, 255, 255, 0.25);
      border-right: 1px solid var(--glass-border-side);
      border-bottom: 1px solid var(--glass-border-bottom);
      box-shadow: var(--glass-specular), var(--glass-drop-shadow);
    }

    /* Header */
    header {
      position: relative;
      z-index: 20;
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 1040px;
      margin: 0 auto;
    }

    .glass-pill {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.55rem 1.25rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--text-secondary);
      transition: all 0.3s ease;
    }

    .status-pill.active .status-dot {
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
    }

    .status-pill.warning .status-dot {
      background: #fbbf24;
      box-shadow: 0 0 12px #fbbf24;
    }

    .status-pill.danger .status-dot {
      background: #ef4444;
      box-shadow: 0 0 12px #ef4444;
    }

    .strikes-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-secondary);
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-right: 0.2rem;
    }

    .strike-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.14);
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.5);
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .strike-dot.active {
      background: #ef4444;
      box-shadow: 0 0 14px #ef4444, inset 0 1px 1px rgba(255, 255, 255, 0.7);
      transform: scale(1.25);
    }

    body[data-theme="football"] .strike-dot {
      width: 11px;
      height: 15px;
      border-radius: 2.5px;
    }
