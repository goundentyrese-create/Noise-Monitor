<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classroom Monitor // Liquid Glass</title>
  <style>
    :root {
      --bg-base: #05070b;
      
      /* True Liquid Glass Material Tokens (Compositor-Safe) */
      --glass-fill: linear-gradient(145deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.03) 50%, rgba(255, 255, 255, 0.06) 100%);
      --glass-pill-fill: linear-gradient(180deg, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0.04) 100%);
      --glass-border-top: rgba(255, 255, 255, 0.36);
      --glass-border-side: rgba(255, 255, 255, 0.15);
      --glass-border-bottom: rgba(255, 255, 255, 0.08);
      --glass-specular: inset 0 1.5px 1px 0 rgba(255, 255, 255, 0.42), inset 1.5px 0 1px 0 rgba(255, 255, 255, 0.18), inset 0 -1.5px 2px 0 rgba(0, 0, 0, 0.4);
      --glass-drop-shadow: 0 28px 60px -12px rgba(0, 0, 0, 0.72), 0 4px 16px -2px rgba(0, 0, 0, 0.4);
      
      --accent: #34d399;
      --accent-rgb: 52, 211, 153;
      --orb-1: rgba(16, 185, 129, 0.42);
      --orb-2: rgba(56, 189, 248, 0.3);
      --orb-3: rgba(167, 243, 208, 0.18);
      
      --text: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.65);
    }

    body[data-color="blue"] {
      --accent: #38bdf8;
      --accent-rgb: 56, 189, 248;
      --orb-1: rgba(2, 132, 199, 0.46);
      --orb-2: rgba(99, 102, 241, 0.34);
      --orb-3: rgba(186, 230, 253, 0.2);
    }

    body[data-color="sunset"] {
      --accent: #fb923c;
      --accent-rgb: 251, 146, 60;
      --orb-1: rgba(234, 88, 12, 0.44);
      --orb-2: rgba(236, 72, 153, 0.32);
      --orb-3: rgba(254, 215, 170, 0.2);
    }

    body[data-color="purple"] {
      --accent: #c084fc;
      --accent-rgb: 192, 132, 252;
      --orb-1: rgba(147, 51, 234, 0.46);
      --orb-2: rgba(59, 130, 246, 0.32);
      --orb-3: rgba(233, 213, 255, 0.2);
    }

    /* iPhone 18 Pro Finishes */
    body[data-color="burgundy"] {
      --accent: #b83b50;
      --accent-rgb: 184, 59, 80;
      --orb-1: rgba(77, 24, 33, 0.72);
      --orb-2: rgba(184, 59, 80, 0.36);
      --orb-3: rgba(244, 114, 136, 0.18);
    }

    body[data-color="glacier"] {
      --accent: #bae6fd;
      --accent-rgb: 186, 230, 253;
      --orb-1: rgba(232, 242, 255, 0.38);
      --orb-2: rgba(125, 211, 252, 0.32);
      --orb-3: rgba(255, 255, 255, 0.2);
    }

    body[data-color="black"] {
      --accent: #a1a1aa;
      --accent-rgb: 161, 161, 170;
      --orb-1: rgba(60, 60, 60, 0.72);
      --orb-2: rgba(113, 113, 122, 0.35);
      --orb-3: rgba(212, 212, 216, 0.15);
    }

    body[data-color="silver"] {
      --accent: #f4f4f5;
      --accent-rgb: 244, 244, 245;
      --orb-1: rgba(247, 247, 247, 0.38);
      --orb-2: rgba(161, 161, 170, 0.32);
      --orb-3: rgba(255, 255, 255, 0.22);
    }

    body.warning-state {
      --orb-1: rgba(245, 158, 11, 0.46);
      --orb-2: rgba(251, 146, 60, 0.32);
    }

    body.danger-state {
      --orb-1: rgba(239, 68, 68, 0.54);
      --orb-2: rgba(244, 63, 94, 0.38);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text);
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 1rem;
      padding: 1.25rem 2rem;
      overflow: hidden;
      position: relative;
      transition: background-color 0.3s ease;
    }

    body.alarm-flash {
      background-color: #2a080d;
    }

    .ambient-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(85px);
      transition: background 0.8s ease;
      animation: float 18s infinite alternate ease-in-out;
      pointer-events: none;
    }

    .orb-1 {
      width: 50vw;
      height: 50vw;
      max-width: 680px;
      max-height: 680px;
      background: var(--orb-1);
      top: 8%;
      left: 14%;
    }

    .orb-2 {
      width: 45vw;
      height: 45vw;
      max-width: 600px;
      max-height: 600px;
      background: var(--orb-2);
      bottom: 6%;
      right: 14%;
      animation-delay: -6s;
    }

    .orb-3 {
      width: 32vw;
      height: 32vw;
      max-width: 420px;
      max-height: 420px;
      background: var(--orb-3);
      top: 42%;
      left: 42%;
      animation-delay: -11s;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(5%, -6%) scale(1.08); }
      100% { transform: translate(-5%, 5%) scale(0.95); }
    }

    /* True Liquid Glass Material with Directional Specular Lighting */
    .liquid-glass {
      position: relative;
      background: var(--glass-fill);
      backdrop-filter: blur(36px) saturate(210%) brightness(1.06);
      -webkit-backdrop-filter: blur(36px) saturate(210%) brightness(1.06);
      border-top: 1px solid var(--glass-border-top);
      border-left: 1px solid rgba(255, 255, 255, 0.25);
      border-right: 1px solid var(--glass-border-side);
      border-bottom: 1px solid var(--glass-border-bottom);
      box-shadow: var(--glass-specular), var(--glass-drop-shadow);
    }

    /* Header */
    header {
      position: relative;
      z-index: 20;
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 1040px;
      margin: 0 auto;
    }

    .glass-pill {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.55rem 1.25rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--text-secondary);
      transition: all 0.3s ease;
    }

    .status-pill.active .status-dot {
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
    }

    .status-pill.warning .status-dot {
      background: #fbbf24;
      box-shadow: 0 0 12px #fbbf24;
    }

    .status-pill.danger .status-dot {
      background: #ef4444;
      box-shadow: 0 0 12px #ef4444;
    }

    .strikes-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-secondary);
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-right: 0.2rem;
    }

    .strike-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.14);
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.5);
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .strike-dot.active {
      background: #ef4444;
      box-shadow: 0 0 14px #ef4444, inset 0 1px 1px rgba(255, 255, 255, 0.7);
      transform: scale(1.25);
    }

    body[data-theme="football"] .strike-dot {
      width: 11px;
      height: 15px;
      border-radius: 2.5px;
    }

    body[data-theme="football"] .strike-dot.active {
      background: #facc15;
      box-shadow: 0 0 14px rgba(250, 204, 21, 0.7), inset 0 1px 1px rgba(255, 255, 255, 0.7);
      transform: scale(1.18) rotate(-4deg);
    }

    body[data-theme="football"] #strike-3.active {
      background: #ef4444;
      box-shadow: 0 0 16px #ef4444, inset 0 1px 1px rgba(255, 255, 255, 0.7);
    }

    /* Main Stage */
    main {
      position: relative;
      z-index: 5;
      flex: 1;
      min-height: 0;
      width: 100%;
      max-width: 920px;
      margin: 0 auto;
      padding: 1.5rem 3rem;
      border-radius: 38px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
    }

    .hero-metric {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
    }

    .theme-kicker {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.4rem;
      transition: color 0.3s ease;
    }

    .percentage-display {
      font-size: clamp(3.5rem, 9vh, 7.2rem);
      font-weight: 700;
      letter-spacing: -3px;
      line-height: 0.95;
      font-variant-numeric: tabular-nums;
      background: linear-gradient(180deg, #ffffff 30%, rgba(255, 255, 255, 0.68) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.25));
    }

    .reward-capsule {
      margin-top: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.38rem 1.15rem;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.11) 0%, rgba(255, 255, 255, 0.03) 100%);
      border-top: 1px solid rgba(255, 255, 255, 0.32);
      border-left: 1px solid rgba(255, 255, 255, 0.16);
      border-right: 1px solid rgba(255, 255, 255, 0.12);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: inset 0 1px 0.5px rgba(255, 255, 255, 0.35), 0 4px 12px rgba(0, 0, 0, 0.22);
    }

    .reward-tag {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: var(--accent);
      text-transform: uppercase;
      transition: color 0.3s ease;
    }

    .reward-input {
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 500;
      outline: none;
      text-align: center;
      min-width: 170px;
    }

    .progress-track {
      width: 100%;
      height: 16px;
      flex-shrink: 0;
      background: rgba(0, 0, 0, 0.34);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      padding: 2.5px;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.55), 0 1px 0 rgba(255, 255, 255, 0.18);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, rgba(255,255,255,0.9), var(--accent));
      border-radius: 999px;
      box-shadow: 0 0 20px var(--accent), inset 0 1px 1px rgba(255, 255, 255, 0.9);
      transition: width 0.2s linear, background 0.4s ease, box-shadow 0.4s ease;
    }

    .visualizer-wrapper {
      width: 100%;
      flex: 1;
      min-height: 70px;
      max-height: 150px;
      position: relative;
    }

    #visualizer {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Lockout Modal */
    #lockout-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 7, 12, 0.72);
      backdrop-filter: blur(40px) saturate(180%);
      -webkit-backdrop-filter: blur(40px) saturate(180%);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      gap: 0.75rem;
    }

    .lockout-card {
      padding: 3rem 4rem;
      border-radius: 36px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }

    #lockout-overlay h1 {
      color: #f87171;
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    #lockout-overlay p {
      color: var(--text-secondary);
      font-size: 1.05rem;
    }

    #cooldown-timer {
      font-size: 4.5rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -2px;
      margin-top: 0.5rem;
    }

    /* Floating Control Dock */
    footer {
      position: relative;
      z-index: 500;
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.85rem;
      padding: 0.6rem 1.15rem;
      border-radius: 999px;
      width: fit-content;
      max-width: 100%;
      margin: 0 auto;
      opacity: 0.5;
      transition: opacity 0.35s ease, transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }

    footer:hover, footer.setup-mode {
      opacity: 1;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-secondary);
      letter-spacing: 0.3px;
    }

    .divider {
      width: 1px;
      height: 20px;
      background: linear-gradient(180deg, transparent, rgba(255, 255, 255, 0.22), transparent);
    }

    /* Tactile Liquid Glass Buttons */
    button.glass-btn {
      position: relative;
      background: var(--glass-pill-fill);
      color: var(--text);
      border-top: 1px solid rgba(255, 255, 255, 0.35);
      border-left: 1px solid rgba(255, 255, 255, 0.18);
      border-right: 1px solid rgba(255, 255, 255, 0.14);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: inset 0 1px 0.5px rgba(255, 255, 255, 0.4), 0 4px 12px rgba(0, 0, 0, 0.25);
      padding: 0.45rem 1.05rem;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.78rem;
      font-weight: 600;
      transition: all 0.22s cubic-bezier(0.22, 1, 0.36, 1);
      user-select: none;
      overflow: hidden;
    }

    button.glass-btn::after {
      content: "";
      position: absolute;
      top: 0;
      left: 8%;
      right: 8%;
      height: 48%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.24) 0%, rgba(255, 255, 255, 0) 100%);
      border-radius: 999px;
      pointer-events: none;
    }

    button.glass-btn:hover {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.26) 0%, rgba(255, 255, 255, 0.08) 100%);
      border-top-color: rgba(255, 255, 255, 0.55);
      transform: translateY(-1px);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.55), 0 6px 16px rgba(0, 0, 0, 0.32);
    }

    button.glass-btn:active {
      transform: scale(0.95);
    }

    button.glass-btn.primary {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.96) 0%, rgba(226, 232, 240, 0.88) 100%);
      color: #07090e;
      border: 1px solid #ffffff;
      box-shadow: inset 0 1px 1px #ffffff, 0 6px 20px rgba(255, 255, 255, 0.28);
    }

    button.glass-btn.danger {
      color: #fecaca;
      background: linear-gradient(180deg, rgba(239, 68, 68, 0.3) 0%, rgba(239, 68, 68, 0.1) 100%);
      border-top-color: rgba(252, 165, 165, 0.45);
      border-color: rgba(248, 113, 113, 0.32);
    }

    button.glass-btn.danger:hover {
      background: linear-gradient(180deg, rgba(239, 68, 68, 0.88) 0%, rgba(220, 38, 38, 0.78) 100%);
      color: #ffffff;
    }

    /* Sliding Glass Pill Switcher */
    .segmented-control {
      position: relative;
      display: flex;
      align-items: center;
      background: rgba(0, 0, 0, 0.36);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.48), 0 1px 0 rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      padding: 3px;
    }

    .glass-glider {
      position: absolute;
      top: 3px;
      bottom: 3px;
      left: 3px;
      width: calc(50% - 3px);
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0.08) 100%);
      border-top: 1px solid rgba(255, 255, 255, 0.5);
      border-left: 1px solid rgba(255, 255, 255, 0.22);
      border-right: 1px solid rgba(255, 255, 255, 0.16);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.5), 0 3px 10px rgba(0, 0, 0, 0.35);
      transition: transform 0.38s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
    }

    .seg-btn {
      position: relative;
      z-index: 2;
      width: 74px;
      background: transparent;
      border: none;
      padding: 0.32rem 0;
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      transition: color 0.25s ease;
    }

    .seg-btn.active {
      color: #ffffff;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
    }

    /* Liquid Droplet Colour Swatches */
    .swatches {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.28rem 0.5rem;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.09);
      box-shadow: inset 0 1px 4px rgba(0, 0, 0, 0.45), 0 1px 0 rgba(255, 255, 255, 0.12);
    }

    .swatch {
      position: relative;
      width: 17px;
      height: 17px;
      border-radius: 50%;
      padding: 0;
      border: 1.5px solid rgba(255, 255, 255, 0.38);
      box-shadow: inset 0 2px 3px rgba(255, 255, 255, 0.7), 0 2px 6px rgba(0, 0, 0, 0.35);
      cursor: pointer;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease;
    }

    .swatch:hover {
      transform: scale(1.18);
    }

    .swatch.active {
      border-color: #ffffff;
      transform: scale(1.24);
      box-shadow: inset 0 2px 3px rgba(255, 255, 255, 0.85), 0 0 12px rgba(255, 255, 255, 0.65);
    }

    /* Optical Liquid Glass Slider */
    .glass-slider-wrap {
      position: relative;
      width: 84px;
      height: 20px;
      display: flex;
      align-items: center;
    }

    .glass-slider-track {
      position: absolute;
      left: 0;
      right: 0;
      height: 7px;
      background: rgba(0, 0, 0, 0.38);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.55), 0 1px 0 rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      overflow: hidden;
      pointer-events: none;
    }

    .glass-slider-fill {
      height: 100%;
      width: 43.75%;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.75), var(--accent));
      box-shadow: 0 0 10px var(--accent);
      border-radius: 999px;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      position: relative;
      z-index: 2;
      width: 100%;
      height: 20px;
      background: transparent;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.98) 0%, rgba(255, 255, 255, 0.5) 55%, rgba(255, 255, 255, 0.22) 100%);
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: inset 0 1px 1px #ffffff, 0 3px 10px rgba(0, 0, 0, 0.45);
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.18);
    }

    input[type="range"]:active::-webkit-slider-thumb {
      transform: scale(1.28);
    }

    input[type="number"] {
      width: 44px;
      background: rgba(0, 0, 0, 0.36);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: inset 0 1px 4px rgba(0, 0, 0, 0.48), 0 1px 0 rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      padding: 0.3rem 0.2rem;
      text-align: center;
      font-size: 0.8rem;
      font-weight: 600;
      outline: none;
    }
  </style>
</head>
<body data-theme="stealth" data-color="emerald">

  <div class="ambient-canvas">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <header>
    <div id="status-pill" class="glass-pill liquid-glass status-pill">
      <div class="status-dot"></div>
      <span id="status-text">Standby</span>
    </div>

    <div class="glass-pill liquid-glass">
      <span class="strikes-label" id="strikes-label">Alerts</span>
      <div class="strike-dot" id="strike-1"></div>
      <div class="strike-dot" id="strike-2"></div>
      <div class="strike-dot" id="strike-3"></div>
    </div>
  </header>

  <main class="liquid-glass">
    <div class="hero-metric">
      <div class="theme-kicker" id="theme-kicker">Acoustic Stealth Protocol</div>
      <div class="percentage-display" id="percent-text">0.0%</div>
      <div class="reward-capsule">
        <span class="reward-tag" id="reward-tag">Target</span>
        <input type="text" class="reward-input" value="5 Mins Free Time" id="reward-text" aria-label="Reward Goal">
      </div>
    </div>

    <div class="progress-track">
      <div class="progress-fill" id="progress-fill"></div>
    </div>

    <div class="visualizer-wrapper">
      <canvas id="visualizer"></canvas>
    </div>
  </main>

  <div id="lockout-overlay">
    <div class="lockout-card liquid-glass">
      <h1 id="lockout-title">System Lockdown</h1>
      <p id="lockout-desc">Noise threshold breached. Decryption paused.</p>
      <div id="cooldown-timer">00:10</div>
    </div>
  </div>

  <footer id="control-dock" class="liquid-glass setup-mode">
    <button type="button" id="start-btn" class="glass-btn primary" onclick="startMic()">Start Mic</button>
    <button type="button" id="reset-btn" class="glass-btn" onclick="resetMonitor()">Reset</button>

    <div class="divider"></div>

    <!-- Sliding Glass Pill Switcher -->
    <div class="segmented-control">
      <div class="glass-glider" id="theme-glider"></div>
      <button type="button" id="btn-stealth" class="seg-btn active" onclick="setTheme('stealth')">Stealth</button>
      <button type="button" id="btn-football" class="seg-btn" onclick="setTheme('football')">Football</button>
    </div>

    <!-- Glass Droplet Colour Swatches -->
    <div class="swatches">
      <button type="button" id="col-emerald" class="swatch active" onclick="setColor('emerald')" style="background: #34d399;" title="Emerald"></button>
      <button type="button" id="col-blue" class="swatch" onclick="setColor('blue')" style="background: #38bdf8;" title="Electric Blue"></button>
      <button type="button" id="col-sunset" class="swatch" onclick="setColor('sunset')" style="background: #fb923c;" title="Sunset"></button>
      <button type="button" id="col-purple" class="swatch" onclick="setColor('purple')" style="background: #c084fc;" title="Ultraviolet"></button>
      <button type="button" id="col-burgundy" class="swatch" onclick="setColor('burgundy')" style="background: #4D1821;" title="iPhone 18 Pro: Burgundy"></button>
      <button type="button" id="col-glacier" class="swatch" onclick="setColor('glacier')" style="background: #E8F2FF;" title="iPhone 18 Pro: Glacier"></button>
      <button type="button" id="col-black" class="swatch" onclick="setColor('black')" style="background: #3C3C3C;" title="iPhone 18 Pro: Black"></button>
      <button type="button" id="col-silver" class="swatch" onclick="setColor('silver')" style="background: #F7F7F7;" title="iPhone 18 Pro: Silver"></button>
    </div>

    <div class="divider"></div>

    <!-- Optical Liquid Glass Slider -->
    <div class="control-group">
      <label for="threshold">Limit</label>
      <div class="glass-slider-wrap">
        <div class="glass-slider-track">
          <div class="glass-slider-fill" id="slider-fill"></div>
        </div>
        <input type="range" id="threshold" min="10" max="90" value="45" oninput="updateSliderFill(this.value)">
      </div>
    </div>

    <div class="control-group">
      <label for="duration">Mins</label>
      <input type="number" id="duration" min="1" max="60" value="10">
    </div>

    <div class="divider"></div>

    <button type="button" id="manual-strike-btn" class="glass-btn danger" onclick="manualStrike()">Alert</button>
  </footer>

  <script>
    let audioCtx, analyser, dataArray, source;
    let isRunning = false;
    let isLockedOut = false;
    let progress = 0;
    let strikes = 0;
    let lastStrikeTime = 0;
    let lastFrameTime = Date.now();
    let currentTheme = "stealth";
    let currentState = "standby";

    const themes = {
      stealth: {
        kicker: "Acoustic Stealth Protocol",
        strikesLabel: "Alerts",
        rewardTag: "Target",
        strikeBtn: "Alert",
        lockoutTitle: "System Lockdown",
        lockoutDesc: "Noise threshold breached. Decryption paused.",
        status: {
          standby: "Standby",
          active: "Stealth Optimal",
          warning: "Approaching Limit",
          danger: "Noise Spike",
          unlocked: "Target Unlocked"
        }
      },
      football: {
        kicker: "Matchday Focus // 90 Min Protocol",
        strikesLabel: "Cards",
        rewardTag: "Trophy",
        strikeBtn: "Foul",
        lockoutTitle: "Red Card // Sin Bin",
        lockoutDesc: "Crowd too loud. Match play suspended for 10s.",
        status: {
          standby: "Pre-Match",
          active: "In Possession",
          warning: "Referee Warning",
          danger: "VAR Check // Foul!",
          unlocked: "Full Time // Victory!"
        }
      }
    };

    const canvas = document.getElementById("visualizer");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() {
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function updateSliderFill(val) {
      const pct = ((val - 10) / (90 - 10)) * 100;
      document.getElementById("slider-fill").style.width = pct + "%";
    }

    updateSliderFill(document.getElementById("threshold").value);

    function setTheme(themeName) {
      currentTheme = themeName;
      document.body.setAttribute("data-theme", themeName);

      const glider = document.getElementById("theme-glider");
      glider.style.transform = themeName === "football" ? "translateX(100%)" : "translateX(0%)";

      document.getElementById("btn-stealth").classList.toggle("active", themeName === "stealth");
      document.getElementById("btn-football").classList.toggle("active", themeName === "football");

      const t = themes[themeName];
      document.getElementById("theme-kicker").textContent = t.kicker;
      document.getElementById("strikes-label").textContent = t.strikesLabel;
      document.getElementById("reward-tag").textContent = t.rewardTag;
      document.getElementById("manual-strike-btn").textContent = t.strikeBtn;
      document.getElementById("lockout-title").textContent = t.lockoutTitle;
      document.getElementById("lockout-desc").textContent = t.lockoutDesc;

      updateStatus(currentState);
    }

    function setColor(colorName) {
      document.body.setAttribute("data-color", colorName);
      ["emerald", "blue", "sunset", "purple", "burgundy", "glacier", "black", "silver"].forEach(c => {
        const el = document.getElementById("col-" + c);
        if (el) el.classList.toggle("active", c === colorName);
      });
    }

    async function startMic() {
      if (isRunning) return;
      const startBtn = document.getElementById("start-btn");
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
        if (audioCtx.state === "suspended") {
          await audioCtx.resume();
        }
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 128;
        source = audioCtx.createMediaStreamSource(stream);
        source.connect(analyser);
        dataArray = new Uint8Array(analyser.frequencyBinCount);
        
        isRunning = true;
        lastFrameTime = Date.now();
        resizeCanvas();
        startBtn.textContent = "Listening";
        startBtn.classList.remove("primary");
        document.getElementById("control-dock").classList.remove("setup-mode");
        updateStatus("active");
        loop();
      } catch (err) {
        alert("Microphone access error: " + err.message);
      }
    }

    function resetMonitor() {
      progress = 0;
      strikes = 0;
      isLockedOut = false;
      document.getElementById("lockout-overlay").style.display = "none";
      updateStrikesUI();
      updateProgressUI();
      updateStatus(isRunning ? "active" : "standby");
    }

    function manualStrike() {
      if (!isLockedOut) triggerStrike();
    }

    function updateStatus(stateKey) {
      currentState = stateKey;
      const t = themes[currentTheme];
      document.getElementById("status-text").textContent = t.status[stateKey] || stateKey;

      const pillClass = (stateKey === "unlocked") ? "active" : stateKey;
      document.getElementById("status-pill").className = "glass-pill liquid-glass status-pill " + pillClass;
      
      document.body.classList.remove("warning-state", "danger-state");
      if (stateKey === "warning") document.body.classList.add("warning-state");
      if (stateKey === "danger") document.body.classList.add("danger-state");
    }

    function updateStrikesUI() {
      for (let i = 1; i <= 3; i++) {
        const dot = document.getElementById("strike-" + i);
        if (i <= strikes) dot.classList.add("active");
        else dot.classList.remove("active");
      }
    }

    function updateProgressUI() {
      const clamped = Math.min(100, Math.max(0, progress));
      document.getElementById("progress-fill").style.width = clamped + "%";
      document.getElementById("percent-text").textContent = clamped.toFixed(1) + "%";

      if (clamped >= 100) {
        updateStatus("unlocked");
      }
    }

    function triggerStrike() {
      const now = Date.now();
      if (now - lastStrikeTime < 2000) return;
      lastStrikeTime = now;

      strikes++;
      updateStrikesUI();

      document.body.classList.add("alarm-flash");
      setTimeout(() => document.body.classList.remove("alarm-flash"), 250);

      progress = Math.max(0, progress - 2);
      updateProgressUI();

      if (strikes >= 3) {
        startLockout();
      } else {
        updateStatus("danger");
      }
    }

    function startLockout() {
      isLockedOut = true;
      const overlay = document.getElementById("lockout-overlay");
      const timer = document.getElementById("cooldown-timer");
      overlay.style.display = "flex";
      let secondsLeft = 10;
      timer.textContent = "00:" + secondsLeft;

      const interval = setInterval(() => {
        secondsLeft--;
        timer.textContent = "00:" + (secondsLeft < 10 ? "0" : "") + secondsLeft;
        if (secondsLeft <= 0) {
          clearInterval(interval);
          isLockedOut = false;
          strikes = 0;
          updateStrikesUI();
          overlay.style.display = "none";
          updateStatus("active");
        }
      }, 1000);
    }

    function drawPitchLines() {
      const w = canvas.width;
      const h = canvas.height;
      ctx.save();
      ctx.strokeStyle = "rgba(255, 255, 255, 0.08)";
      ctx.lineWidth = 1.5;

      ctx.beginPath();
      ctx.moveTo(w / 2, 0);
      ctx.lineTo(w / 2, h);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(w / 2, h / 2, Math.min(w, h) * 0.32, 0, Math.PI * 2);
      ctx.stroke();

      const boxW = w * 0.11;
      const boxH = h * 0.65;
      ctx.strokeRect(0, (h - boxH) / 2, boxW, boxH);
      ctx.strokeRect(w - boxW, (h - boxH) / 2, boxW, boxH);
      ctx.restore();
    }

    function loop() {
      requestAnimationFrame(loop);
      const now = Date.now();
      const deltaSeconds = (now - lastFrameTime) / 1000;
      lastFrameTime = now;

      analyser.getByteFrequencyData(dataArray);

      let sum = 0;
      const usableBins = Math.floor(dataArray.length * 0.65);
      for (let i = 0; i < usableBins; i++) {
        sum += dataArray[i];
      }
      const averageVolume = (sum / usableBins) / 2.55;
      const threshold = parseInt(document.getElementById("threshold").value, 10);

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (currentTheme === "football") {
        drawPitchLines();
      }

      const threshY = canvas.height - (threshold / 100) * canvas.height;
      ctx.beginPath();
      ctx.moveTo(0, threshY);
      ctx.lineTo(canvas.width, threshY);
      ctx.strokeStyle = "rgba(255, 255, 255, 0.22)";
      ctx.setLineDash([4, 6]);
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.setLineDash([]);

      const accentRgb = getComputedStyle(document.body).getPropertyValue("--accent-rgb").trim() || "52, 211, 153";

      const gap = 7;
      const totalBars = usableBins;
      const barWidth = Math.max(2, (canvas.width - (gap * (totalBars - 1))) / totalBars);

      for (let i = 0; i < totalBars; i++) {
        const value = dataArray[i] / 255;
        const barHeight = Math.max(8, value * canvas.height);
        const x = i * (barWidth + gap);
        const y = canvas.height - barHeight;

        const gradient = ctx.createLinearGradient(0, y, 0, canvas.height);
        if (averageVolume > threshold) {
          gradient.addColorStop(0, "rgba(248, 113, 113, 0.95)");
          gradient.addColorStop(1, "rgba(239, 68, 68, 0.25)");
        } else if (averageVolume > threshold * 0.8) {
          gradient.addColorStop(0, "rgba(251, 191, 36, 0.95)");
          gradient.addColorStop(1, "rgba(245, 158, 11, 0.25)");
        } else {
          gradient.addColorStop(0, "rgba(255, 255, 255, 0.85)");
          gradient.addColorStop(1, "rgba(" + accentRgb + ", 0.28)");
        }

        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.roundRect(x, y, barWidth, barHeight, 6);
        ctx.fill();
      }

      if (!isLockedOut && progress < 100) {
        if (averageVolume > threshold) {
          triggerStrike();
        } else if (averageVolume > threshold * 0.8) {
          updateStatus("warning");
        } else {
          updateStatus("active");
          const totalSecondsNeeded = parseInt(document.getElementById("duration").value, 10) * 60;
          progress += (deltaSeconds / totalSecondsNeeded) * 100;
          updateProgressUI();
        }
      }
    }
  </script>
</body>
</html>
