<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classroom Monitor // Liquid Glass</title>
  <style>
    :root {
      --bg-base: #070a10;
      
      /* Surface Pro 11 / Snapdragon GPU-Safe Liquid Glass Surface */
      --glass-surface: linear-gradient(145deg, rgba(255, 255, 255, 0.22) 0%, rgba(255, 255, 255, 0.08) 48%, rgba(255, 255, 255, 0.12) 100%);
      --glass-pill-fill: linear-gradient(180deg, rgba(255, 255, 255, 0.26) 0%, rgba(255, 255, 255, 0.09) 100%);
      --glass-specular: inset 0 1.5px 1.2px 0 rgba(255, 255, 255, 0.65), inset 1.5px 0 1.2px 0 rgba(255, 255, 255, 0.35), inset 0 -1.5px 2px 0 rgba(0, 0, 0, 0.45);
      --glass-drop-shadow: 0 24px 50px -12px rgba(0, 0, 0, 0.75), 0 4px 16px -2px rgba(0, 0, 0, 0.45);
      
      --accent: #34d399;
      --accent-rgb: 52, 211, 153;
      --orb-1: rgba(16, 185, 129, 0.42);
      --orb-2: rgba(56, 189, 248, 0.32);
      --orb-3: rgba(167, 243, 208, 0.2);
    }

    body[data-color="blue"] {
      --accent: #38bdf8;
      --accent-rgb: 56, 189, 248;
      --orb-1: rgba(2, 132, 199, 0.46);
      --orb-2: rgba(99, 102, 241, 0.36);
      --orb-3: rgba(186, 230, 253, 0.22);
    }

    body[data-color="sunset"] {
      --accent: #fb923c;
      --accent-rgb: 251, 146, 60;
      --orb-1: rgba(234, 88, 12, 0.44);
      --orb-2: rgba(236, 72, 153, 0.32);
      --orb-3: rgba(254, 215, 170, 0.2);
    }

    body[data-color="purple"] {
      --accent: #c084fc;
      --accent-rgb: 192, 132, 252;
      --orb-1: rgba(147, 51, 234, 0.46);
      --orb-2: rgba(59, 130, 246, 0.34);
      --orb-3: rgba(233, 213, 255, 0.2);
    }

    /* iPhone 18 Pro Finishes */
    body[data-color="burgundy"] {
      --accent: #b83b50;
      --accent-rgb: 184, 59, 80;
      --orb-1: rgba(140, 35, 52, 0.72);
      --orb-2: rgba(184, 59, 80, 0.38);
      --orb-3: rgba(244, 114, 136, 0.22);
    }

    body[data-color="glacier"] {
      --accent: #bae6fd;
      --accent-rgb: 186, 230, 253;
      --orb-1: rgba(200, 232, 255, 0.45);
      --orb-2: rgba(125, 211, 252, 0.35);
      --orb-3: rgba(255, 255, 255, 0.25);
    }

    body[data-color="black"] {
      --accent: #a1a1aa;
      --accent-rgb: 161, 161, 170;
      --orb-1: rgba(70, 70, 80, 0.72);
      --orb-2: rgba(113, 113, 122, 0.38);
      --orb-3: rgba(212, 212, 216, 0.18);
    }

    body[data-color="silver"] {
      --accent: #f4f4f5;
      --accent-rgb: 244, 244, 245;
      --orb-1: rgba(235, 235, 240, 0.45);
      --orb-2: rgba(161, 161, 170, 0.35);
      --orb-3: rgba(255, 255, 255, 0.28);
    }

    body.warning-state {
      --orb-1: rgba(245, 158, 11, 0.48);
      --orb-2: rgba(251, 146, 60, 0.34);
    }

    body.danger-state {
      --orb-1: rgba(239, 68, 68, 0.56);
      --orb-2: rgba(244, 63, 94, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text);
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 1rem;
      padding: 1.25rem 2rem;
      overflow: hidden;
      position: relative;
      transition: background-color 0.3s ease;
    }

    body.alarm-flash {
      background-color: #2a080d;
    }

    /* Ambient Lighting Canvas */
    .ambient-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      transition: background 0.8s ease;
    }

    .orb-1 {
      width: 65vw;
      height: 65vw;
      max-width: 850px;
      max-height: 850px;
      background: radial-gradient(circle, var(--orb-1) 0%, transparent 68%);
      top: -10%;
      left: 5%;
    }

    .orb-2 {
      width: 60vw;
      height: 60vw;
      max-width: 780px;
      max-height: 780px;
      background: radial-gradient(circle, var(--orb-2) 0%, transparent 68%);
      bottom: -10%;
      right: 5%;
    }

    .orb-3 {
      width: 45vw;
      height: 45vw;
      max-width: 580px;
      max-height: 580px;
      background: radial-gradient(circle, var(--orb-3) 0%, transparent 68%);
      top: 25%;
      left: 30%;
    }

    /* True Liquid Glass Panel */
    .liquid-glass {
      position: relative;
      z-index: 5;
      background-color: rgba(28, 34, 48, 0.78);
      background-image: var(--glass-surface);
      border-top: 1px solid rgba(255, 255, 255, 0.58);
      border-left: 1px solid rgba(255, 255, 255, 0.38);
      border-right: 1
